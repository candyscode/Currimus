name: Currimus
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 6 language mode. The project targets iOS 26 / watchOS 11, so there
    # is no runtime reason to stay on 5.10 — and 5.10 hid a real data race on
    # the WatchConnectivity callbacks, which are written on the main actor and
    # were being read from the delegate's background queue.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Extract every user-facing literal into Resources/Localizable.xcstrings.
    # SwiftUI Text literals are already localization keys; this makes them
    # (and String(localized:) call sites) show up in the catalogue.
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: YES
    # The app uses no encryption beyond what iOS itself provides over HTTPS —
    # in fact it makes no network calls at all. Declaring it here answers the
    # export-compliance question once, instead of on every single upload.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    CODE_SIGN_STYLE: Automatic
    # The project file is generated, so anything set by hand in Xcode's
    # Signing & Capabilities pane survives exactly until the next
    # `xcodegen generate`. The team belongs here or it does not persist —
    # and HealthKit cannot be built onto a device without it.
    DEVELOPMENT_TEAM: 88U4UH4ASG
    CURRENT_PROJECT_VERSION: 1
    # 1.0 shipped. Set here, never in the .xcodeproj: that file is
    # generated, and a bump written into it is lost at the next
    # `xcodegen generate` — which is how 1.1 disappeared once.
    MARKETING_VERSION: "1.2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# XcodeGen writes no schemes unless asked, and Xcode's autocreation is flaky
# right after a regenerate with the project open — it dropped the iOS `Currimus`
# scheme, which is the one you archive. Define the schemes we actually drive, by
# hand and from the scripts (Currimus, CurrimusWatch, CurrimusTests), so they are
# shared, deterministic and survive every `xcodegen generate`.
schemes:
  Currimus:
    build:
      targets:
        Currimus: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CurrimusTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  CurrimusWatch:
    build:
      targets:
        CurrimusWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  CurrimusTests:
    build:
      targets:
        CurrimusTests: all
    test:
      config: Debug
      targets:
        - CurrimusTests
  CurrimusWatchTests:
    build:
      targets:
        CurrimusWatchTests: all
    test:
      config: Debug
      targets:
        - CurrimusWatchTests
  CurrimusUITests:
    build:
      targets:
        CurrimusUITests: all
    test:
      config: Debug
      targets:
        - CurrimusUITests

targets:
  Currimus:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # Required since May 2024. Both apps and the widget read UserDefaults,
      # which is a required-reason API; without a manifest declaring it the
      # upload is answered with ITMS-91053.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currimus.app
        INFOPLIST_KEY_CFBundleDisplayName: Currimus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # At runtime the iPhone only reads Health — the watch saves the workout,
        # and this app reads runs other apps recorded. But the shared HealthKit
        # code (RunStore → HealthImport.requestAuthorization(toShare:read:)) links
        # the share-authorization symbol into the iPhone binary, so the App Store
        # static analyser (error 90683) demands the update description too, even
        # though no write ever fires. It is required, not shown; keep it honest.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Currimus reads your running workouts from Apple Health, so every total counts what you actually ran."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Currimus saves your runs as workouts to Apple Health."
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: iOS/Currimus.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.currimus.app]
    dependencies:
      - target: CurrimusWatch

  CurrimusWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
      # The widget views, so `-push widgets` can render them inside the app.
      # A complication is otherwise only visible by putting it on a face by
      # hand — which is how the tinted-mode bug in CUR-42 got out.
      - path: WatchWidgets/WidgetSurfaces.swift
      - path: Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # Required since May 2024. Both apps and the widget read UserDefaults,
      # which is a required-reason API; without a manifest declaring it the
      # upload is answered with ITMS-91053.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currimus.app.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Currimus
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Currimus reads heart rate and distance to show live pace and zones during your run."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Currimus saves your runs as workouts to Apple Health."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Currimus uses GPS to record your route, distance and elevation while you run."
        # The barometric altimeter (CMAltimeter) is motion hardware, and touching
        # it without this key is a launch-time crash, not a denial. It is what
        # elevation is measured with — see Shared/Altimeter.swift.
        INFOPLIST_KEY_NSMotionUsageDescription: "Currimus reads the watch's barometric altimeter to measure the height you climb."
    # WKBackgroundModes is an array; the INFOPLIST_KEY_ shorthand silently
    # dropped it, so the app was suspended the moment it left the foreground
    # mid-run. A real plist is the only reliable way to declare it.
    info:
      path: Watch/Info.plist
      properties:
        # Both were literals here, so the watch app stayed on 1.0/1 while the
        # iPhone app followed MARKETING_VERSION. App Store Connect rejects a
        # bundle whose embedded watch app disagrees with it.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.currimus.app
        # The workout session keeps the app alive, but CoreLocation still refuses
        # to deliver fixes in the background without its own declaration — and
        # `allowsBackgroundLocationUpdates` traps at runtime if it is missing.
        # On watchOS that declaration is `location` in UIBackgroundModes, NOT in
        # WKBackgroundModes: WKBackgroundModes only accepts the watch-specific
        # modes (workout-processing, self-care, …), so `location` there is
        # rejected on upload (error 90362 "Invalid Info.plist value"). The two
        # keys together are what a real running watch app declares.
        WKBackgroundModes: [workout-processing]
        UIBackgroundModes: [location]
        WKSupportsAlwaysOnDisplay: true
        CFBundleDisplayName: Currimus
    entitlements:
      path: Watch/CurrimusWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.currimus.app]
    dependencies:
      - target: CurrimusWatchWidgets

  CurrimusWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
      - Shared
      - path: Fonts
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currimus.app.watchkitapp.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Currimus
    entitlements:
      path: WatchWidgets/CurrimusWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.currimus.app]
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Currimus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Gestures cannot be asserted in a unit test and cannot be driven by
  # `simctl` — the log's swipe-to-delete broke twice before anything could
  # catch it. This target exists for interactions, and holds only those.
  CurrimusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Currimus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currimus.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Currimus

  # `RunSession` is the second-largest file in the app and ran in no test at
  # all, because there was nowhere to put one. What lives there is not
  # arithmetic — `RunMetrics` owns that and is well covered — it is the shell
  # around it: assembling the finished run, the phase machine, the coach's
  # lifecycle across two runs.
  CurrimusWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - TestsWatch
      - Shared
      # One file, not the folder. Everything else under Watch/ is views, and
      # `WatchApp.swift` carries `@main`, which a test bundle must not contain.
      # `RunSession` references nothing Watch-local, so this compiles clean.
      - Watch/RunSession.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currimus.app.watchtests
        GENERATE_INFOPLIST_FILE: YES

  CurrimusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # UISnapshots holds the UI-regression harness's golden PNGs and its
      # scratch output — data for scripts/ui-snapshot.sh, not the XCTest bundle.
      # Without this exclude xcodegen copies them in as resources, and the
      # ios/watch/_work copies collide on basename ("multiple commands produce").
      - path: Tests
        excludes:
          - "UISnapshots/**"
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currimus.app.tests
        GENERATE_INFOPLIST_FILE: YES
